[package]
name = "tower-of-babel"
version.workspace = true
edition = "2024"
description = "Flight aggregation and position service with filtering capabilities"
authors.workspace = true
license.workspace = true
readme = "../../README.md"
repository.workspace = true
keywords = ["flight-aggregation", "aviation", "api", "microservice"]
categories = ["web-programming", "aerospace"]

[dependencies]
# Local dependencies
sky-tracer = { path = "../sky-tracer" }

# Workspace dependencies
axum = { workspace = true, features = ["macros"] }
tokio = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

# Tracing dependencies from workspace
axum-tracing-opentelemetry = { workspace = true }
init-tracing-opentelemetry = { workspace = true }
tracing = { workspace = true }
reqwest-middleware = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
