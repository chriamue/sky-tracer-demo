[package]
name = "sky-tracer-demo"
version = "0.1.0"
edition = "2024"

resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Sky Tracer Team"]
license = "MIT"
repository = "https://github.com/chriamue/sky-tracer-demo"

[workspace]
members = [
    "crates/airport-anywhere",
    "crates/flight-controller",
    "crates/flightmare-tracker",
    "crates/sky-tracer",
    "crates/cockpit",
    "crates/orbital-beacon",
    "crates/tower-of-babel",
    "crates/delay-orama",
    "crates/sky-nexus",
    "crates/flight-map",
]

[workspace.dependencies]
# Common dependencies with fixed versions
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
yew = { version = "0.21" }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.13", features = ["json"] }
thiserror = "2.0"
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

# Tracing related
tracing = "0.1"
axum-tracing-opentelemetry = "0.33"
init-tracing-opentelemetry = { version = "0.36", features = [
    "otlp",
    "tracing_subscriber_ext",
] }
reqwest-middleware = { version = "0.5", features = ["json", "query"] }
opentelemetry = "0.31"
tracing-opentelemetry = "0.32"
async-trait = "0.1"
http = "1"
